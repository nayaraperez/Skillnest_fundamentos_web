<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="NayaraPérez">
    <title>Taco Palace</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>


    <header>
        <nav class="barra">
            <div class="logo_taco">
                <img src="static/img/Imágenes/logo.png" alt="taco_logo">
                <h1><span class="texto_naranja">Taco</span>Palace</h1>
            </div>
            <div class="logo_carrito">
                <div class="barra_busqueda">
                    <input type="text" id="usuario" placeholder="email">
                    <button class="boton_naranja">Login</button>
                </div>
                <div class="carrito_cero"><img src="static/img/Imágenes/carrito.png" alt="carrito">
                    <samp>0</samp>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="seccion_principal">

            <div class="menu_arriba">
                <div class="foto_comida">
                <img src="static/img/Imágenes/enchiladas.jpg" alt="enchilada">
                <p>Enchiladas</p>
                </div>
                <div class="foto_comida">
                <img src="static/img/Imágenes/tacos.jpg" alt="tacos">
                <p>Tacos</p>
                   </div>
                <div class="foto_comida">
                <img src="static/img/Imágenes/flautas.jpg" alt="flauta">
                <p>Flautas</p>
                   </div>
                <div class="foto_comida">
                
                <img src="static/img/Imágenes/gorditas.jpg" alt="gorditas">
                <p>Gorditas</p>
                 </div>
                <div class="foto_comida">
                <img src="static/img/Imágenes/tostadas.jpg" alt="tostadas">
                <p>Tostadas</p>
                 </div>
                <div class="foto_comida">
                <img src="static/img/Imágenes/enfrijoladas.jpg" alt="emfrijoladas">
                <p>Enfrijoladas</p>
                </div>
            </div>

            <section class="seccion_intermedia">
                <section class="section_izquerda">
                    <div class="texto_grande">
                    <h2>La mejor variedad en platillos de comida <samp>mexicana</samp></h2>
                    <p>Contamos con <a href="#">servicio</a> a <samp>domicilio</samp></p>
                    </div>
                    <img src="static/img/Imágenes/comida-mexicana.jpg" alt="comida_media_principal">
                </section>



                <section class="section_derecha">
                    <h3>Recomendados:</h3>
                    <div class="caja"><img src="static/img/Imágenes/" alt="imagen_cajas">
                        <p>ordenes de tacos</p> <a href="#">Ver Mas...</a> <div><button class="Mas">+</button></div>
                    </div>
                    <div class="caja"><img src="static/img/Imágenes/" alt="imagen_cajas">
                        <p>ordenes de tacos</p> <a href="#">Ver Mas...</a> <div><button class="Mas">+</button></div>
                    </div>
                </section>




            </section>
        </section>
    </main>
    <footer></footer>


    <script src="static/js/script.js"></script>
</body>

</html>
