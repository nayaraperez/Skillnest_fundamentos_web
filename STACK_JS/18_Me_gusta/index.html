<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Social like</title>
    <link rel="stylesheet" href="static/css/style.css">

<body>
    <header class="header">
        <nav class="barra">

                <div class="tarjeta"><img src="static/img/misato.png" alt="Foto_perfil">

            </section>

            <section class="contenedor_derecho">
                <h2> Últimas publicaciones</h2>
                <div class="cajas">

                    <section class="titulo_tarjeta">
                        <h3>Rei</h3>
                        <section class="titulo_Like">
                            <p class="contador">0 like(s)</p> <button class="botones_likes">Like</button>
                        </section>
                    </section>
                    <p>Acabo de configurar este nuevo <a href="#">bot de Discrod</a>, cuéntame que opinan ustedes.</p>
                </div>
                <div class="cajas">

                    <section class="titulo_tarjeta">
                        <h3>Azuka</h3>
                        <section class="titulo_Like">
                            <p class="contador">0 like(s)</p> <button class="botones_likes">Like</button>
                        </section>
                    </section>
                    <p>Acabo de leer este <a class="azul_enlace" href="#">nuevo comic</a>. Denle un vistazo.</p>
                </div>
                <div class="cajas">
                    <section class="titulo_tarjeta">
                        <h3>Shinji</h3>
                        <section class="titulo_Like">
                            <p class="contador">0 like(s)</p> <button class="botones_likes">Like</button>
                        </section>
                    </section>
                    <p>No puedo dejar de escuchar este <a a class="azul_enlace" href="#">album</a>. ¿A quién más le
                        gusta?</p>
                </div>
            </section>
        </section>
    </main>
    <script src="static/js/script.js"></script>
</body>

</html>
